name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run lint --workspace @travel-universe/web
      - run: npm run typecheck --workspace @travel-universe/web

  backend:
    name: API and worker syntax/tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/api/requirements.txt
      - run: python -m compileall -q apps/api/app apps/api/tests apps/worker
      - run: PYTHONPATH=apps/api pytest -q apps/api/tests

  compose:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate CPU and optional GPU Compose profiles
        run: |
          docker compose config --quiet
          docker compose --profile gpu config --quiet
