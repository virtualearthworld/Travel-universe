# Render Blueprint for Travel Universe backend.
# Review resource pricing in Render before deploying this blueprint.
# The API, background worker and managed Redis are separate services.
# S3-compatible object storage must be provisioned separately.

services:
  - type: web
    name: travel-universe-api
    runtime: docker
    plan: starter
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: travel-universe-redis
          property: connectionString
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        value: travel-universe-media
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        value: auto
      - key: CORS_ORIGINS
        value: https://virtualearthworld.github.io

  - type: worker
    name: travel-universe-worker
    runtime: docker
    plan: starter
    dockerContext: .
    dockerfilePath: ./apps/worker/Dockerfile
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: travel-universe-redis
          property: connectionString
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        value: travel-universe-media
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        value: auto

  - type: keyvalue
    name: travel-universe-redis
    plan: starter
    maxmemoryPolicy: noeviction
